<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="'Segoe UI', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif">
  <title>Short URL — ER Diagram</title>
  <defs>
    <style>
      .card { fill: #161d2b; stroke-width: 2; }
      .tname { fill: #0b1020; font-size: 20px; font-weight: 800; }
      .tdesc { fill: #0b1020; font-size: 12.5px; }
      .col { fill: #f1f5f9; font-size: 14px; font-family: Consolas, 'Courier New', monospace; }
      .type { fill: #94a3b8; font-size: 12.5px; font-family: Consolas, 'Courier New', monospace; text-anchor: end; }
      .note { fill: #64748b; font-size: 11px; }
      .row { stroke: #263043; stroke-width: 1; }
      .pk { stroke: #f1f5f9; stroke-width: 1.5; }
      .fk { stroke: #f1f5f9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .rel { fill: none; stroke: #e2e8f0; stroke-width: 2; }
      .rellabel { fill: #f8fafc; font-size: 14px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="450" rx="24" fill="#0f1420"/>
  <rect x="24" y="24" width="8" height="52" rx="4" fill="#a855f7"/>
  <text x="44" y="56" fill="#f8fafc" font-size="30" font-weight="800">Short URL — ER Diagram</text>
  
  <rect class="card" x="30" y="120" width="340" height="224" rx="14" stroke="#f59e0b"/>
  <path d="M30 134 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v50 h-340 z" fill="#f59e0b"/>
  <text class="tname" x="48" y="152">users</text>
  <text class="tdesc" x="48" y="172">บัญชีผู้ใช้และสิทธิ์</text>
  <text class="col" x="48" y="205">id</text><text class="type" x="356" y="205">SERIAL</text>
  <line class="pk" x1="48" y1="208" x2="63.4" y2="208"/>
  <line class="row" x1="30" y1="216" x2="370" y2="216"/>
  <text class="col" x="48" y="233">username</text><text class="type" x="356" y="233">VARCHAR(30)</text>
  <text class="note" x="48" y="244">UNIQUE</text>
  <line class="row" x1="30" y1="248" x2="370" y2="248"/>
  <text class="col" x="48" y="265">password_hash</text><text class="type" x="356" y="265">VARCHAR(100)</text>
  <text class="note" x="48" y="276">bcrypt hash ไม่เก็บรหัสจริง</text>
  <line class="row" x1="30" y1="280" x2="370" y2="280"/>
  <text class="col" x="48" y="297">role</text><text class="type" x="356" y="297">VARCHAR(10)</text>
  <text class="note" x="48" y="308">user | admin</text>
  <line class="row" x1="30" y1="312" x2="370" y2="312"/>
  <text class="col" x="48" y="333">created_at</text><text class="type" x="356" y="333">TIMESTAMPTZ</text>
  <rect class="card" x="430" y="120" width="340" height="288" rx="14" stroke="#a855f7"/>
  <path d="M430 134 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v50 h-340 z" fill="#a855f7"/>
  <text class="tname" x="448" y="152">urls</text>
  <text class="tdesc" x="448" y="172">ลิงก์ต้นฉบับคู่กับรหัสสั้น และเจ้าของ</text>
  <text class="col" x="448" y="205">id</text><text class="type" x="756" y="205">SERIAL</text>
  <line class="pk" x1="448" y1="208" x2="463.4" y2="208"/>
  <line class="row" x1="430" y1="216" x2="770" y2="216"/>
  <text class="col" x="448" y="237">user_id</text><text class="type" x="756" y="237">INTEGER</text>
  <line class="fk" x1="448" y1="240" x2="501.9" y2="240"/>
  <line class="row" x1="430" y1="248" x2="770" y2="248"/>
  <text class="col" x="448" y="269">original_url</text><text class="type" x="756" y="269">TEXT</text>
  <line class="row" x1="430" y1="280" x2="770" y2="280"/>
  <text class="col" x="448" y="297">short_code</text><text class="type" x="756" y="297">VARCHAR(20)</text>
  <text class="note" x="448" y="308">UNIQUE</text>
  <line class="row" x1="430" y1="312" x2="770" y2="312"/>
  <text class="col" x="448" y="333">is_active</text><text class="type" x="756" y="333">BOOLEAN</text>
  <line class="row" x1="430" y1="344" x2="770" y2="344"/>
  <text class="col" x="448" y="361">expires_at</text><text class="type" x="756" y="361">TIMESTAMPTZ</text>
  <text class="note" x="448" y="372">ว่าง = ไม่มีวันหมดอายุ</text>
  <line class="row" x1="430" y1="376" x2="770" y2="376"/>
  <text class="col" x="448" y="397">created_at</text><text class="type" x="756" y="397">TIMESTAMPTZ</text>
  <rect class="card" x="830" y="120" width="340" height="288" rx="14" stroke="#22d3ee"/>
  <path d="M830 134 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v50 h-340 z" fill="#22d3ee"/>
  <text class="tname" x="848" y="152">clicks</text>
  <text class="tdesc" x="848" y="172">การเปิดลิงก์ 1 แถว ต่อ 1 ครั้ง</text>
  <text class="col" x="848" y="205">id</text><text class="type" x="1156" y="205">BIGSERIAL</text>
  <line class="pk" x1="848" y1="208" x2="863.4" y2="208"/>
  <line class="row" x1="830" y1="216" x2="1170" y2="216"/>
  <text class="col" x="848" y="237">url_id</text><text class="type" x="1156" y="237">INTEGER</text>
  <line class="fk" x1="848" y1="240" x2="894.2" y2="240"/>
  <line class="row" x1="830" y1="248" x2="1170" y2="248"/>
  <text class="col" x="848" y="269">clicked_at</text><text class="type" x="1156" y="269">TIMESTAMPTZ</text>
  <line class="row" x1="830" y1="280" x2="1170" y2="280"/>
  <text class="col" x="848" y="297">ip_hash</text><text class="type" x="1156" y="297">VARCHAR(64)</text>
  <text class="note" x="848" y="308">SHA-256 + salt ไม่เก็บ IP จริง</text>
  <line class="row" x1="830" y1="312" x2="1170" y2="312"/>
  <text class="col" x="848" y="333">user_agent</text><text class="type" x="1156" y="333">VARCHAR(500)</text>
  <line class="row" x1="830" y1="344" x2="1170" y2="344"/>
  <text class="col" x="848" y="365">referrer</text><text class="type" x="1156" y="365">VARCHAR(500)</text>
  <line class="row" x1="830" y1="376" x2="1170" y2="376"/>
  <text class="col" x="848" y="393">device_type</text><text class="type" x="1156" y="393">VARCHAR(20)</text>
  <text class="note" x="848" y="404">mobile · tablet · desktop · bot</text>
  
  <line class="rel" x1="370" y1="152" x2="430" y2="152"/>
  <text class="rellabel" x="400" y="144">1 : N</text>
  
  <line class="rel" x1="770" y1="152" x2="830" y2="152"/>
  <text class="rellabel" x="800" y="144">1 : N</text>
</svg>
