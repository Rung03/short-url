<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="'Segoe UI', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif">
  <title>Short URL — System Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
    <style>
      .panel { fill: #161d2b; stroke-width: 2; }
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .sub { fill: #cbd5e1; font-size: 14px; }
      .small { fill: #94a3b8; font-size: 12.5px; }
      .mono { fill: #94a3b8; font-size: 12px; font-family: Consolas, 'Courier New', monospace; }
      .flow { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .badge circle { fill: #0f1420; stroke: #f8fafc; stroke-width: 2; }
      .badge text { fill: #f8fafc; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .flowlabel { fill: #e2e8f0; font-size: 13px; }
      .chip { fill: #1f2940; stroke: #a855f7; stroke-width: 1.5; }
      .chiptext { fill: #e9d5ff; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="940" rx="24" fill="#0f1420"/>
  <rect x="24" y="24" width="8" height="52" rx="4" fill="#3b82f6"/>
  <text x="44" y="56" fill="#f8fafc" font-size="30" font-weight="800">Short URL — System Architecture</text>
  <text x="44" y="82" class="sub">React · Node.js / Express · PostgreSQL  —  Vercel · Render · Neon</text>

  <!-- ===== Developer ===== -->
  <rect class="panel" x="40" y="120" width="260" height="150" rx="16" stroke="#f59e0b"/>
  <text x="62" y="152" class="title">Developer</text>
  <!-- person -->
  <circle cx="92" cy="194" r="13" fill="#f59e0b"/>
  <path d="M70 238 a22 18 0 0 1 44 0 z" fill="#f59e0b"/>
  <!-- laptop -->
  <rect x="140" y="182" width="70" height="44" rx="5" fill="#1f2940" stroke="#93c5fd" stroke-width="2"/>
  <path d="M158 196 l10 8 l-10 8 M176 212 h14" stroke="#93c5fd" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="128" y="228" width="94" height="8" rx="3" fill="#93c5fd"/>
  <text x="62" y="258" class="small">VS Code + Claude Code</text>

  <!-- ===== GitHub ===== -->
  <rect class="panel" x="40" y="350" width="260" height="150" rx="16" stroke="#9ca3af"/>
  <text x="62" y="382" class="title">GitHub</text>
  <!-- git branch icon -->
  <g stroke="#e5e7eb" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="80" y1="412" x2="80" y2="462"/>
    <path d="M80 448 C80 430 118 438 118 420"/>
  </g>
  <circle cx="80" cy="410" r="7" fill="#0f1420" stroke="#e5e7eb" stroke-width="3"/>
  <circle cx="80" cy="466" r="7" fill="#0f1420" stroke="#e5e7eb" stroke-width="3"/>
  <circle cx="118" cy="416" r="7" fill="#0f1420" stroke="#e5e7eb" stroke-width="3"/>
  <text x="146" y="428" class="sub">Rung03/short-url</text>
  <text x="146" y="450" class="mono">branch: main</text>
  <text x="62" y="488" class="small">เก็บโค้ด backend + frontend</text>

  <!-- ===== User / Admin ===== -->
  <rect class="panel" x="430" y="120" width="340" height="110" rx="16" stroke="#38bdf8"/>
  <circle cx="480" cy="160" r="13" fill="#38bdf8"/>
  <path d="M458 204 a22 18 0 0 1 44 0 z" fill="#38bdf8"/>
  <text x="522" y="160" class="title">ผู้ใช้ / Admin</text>
  <text x="522" y="186" class="sub">เบราว์เซอร์ (คอม / มือถือ)</text>
  <text x="522" y="208" class="small">ย่อลิงก์ · ดู Dashboard · จัดการผู้ใช้</text>

  <!-- ===== Frontend (Vercel) ===== -->
  <rect class="panel" x="430" y="300" width="340" height="140" rx="16" stroke="#22d3ee"/>
  <!-- browser window icon -->
  <rect x="452" y="326" width="58" height="44" rx="6" fill="#1f2940" stroke="#22d3ee" stroke-width="2"/>
  <line x1="452" y1="338" x2="510" y2="338" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="460" cy="332" r="2" fill="#22d3ee"/><circle cx="467" cy="332" r="2" fill="#22d3ee"/>
  <text x="526" y="336" class="title">Frontend · Vercel</text>
  <text x="526" y="360" class="sub">React + Vite (SPA)</text>
  <text x="452" y="396" class="small">Login · Shorten · Dashboard · Users · QR Code</text>
  <text x="452" y="420" class="mono">short-url-eight-amber.vercel.app</text>

  <!-- ===== Backend (Render) ===== -->
  <rect class="panel" x="430" y="510" width="340" height="200" rx="16" stroke="#a855f7"/>
  <!-- server icon -->
  <g fill="#1f2940" stroke="#a855f7" stroke-width="2">
    <rect x="452" y="530" width="44" height="14" rx="3"/>
    <rect x="452" y="548" width="44" height="14" rx="3"/>
    <rect x="452" y="566" width="44" height="14" rx="3"/>
  </g>
  <circle cx="488" cy="537" r="2" fill="#a855f7"/><circle cx="488" cy="555" r="2" fill="#a855f7"/><circle cx="488" cy="573" r="2" fill="#a855f7"/>
  <text x="512" y="546" class="title">Backend API · Render</text>
  <text x="512" y="570" class="sub">Node.js + Express (Singapore)</text>
  <rect class="chip" x="448" y="596" width="96" height="58" rx="10"/>
  <text class="chiptext" x="496" y="620">Auth</text>
  <text class="chiptext" x="496" y="640" font-size="11.5">JWT · bcrypt</text>
  <rect class="chip" x="552" y="596" width="96" height="58" rx="10"/>
  <text class="chiptext" x="600" y="620">Links API</text>
  <text class="chiptext" x="600" y="640" font-size="11.5">สถิติ · Dashboard</text>
  <rect class="chip" x="656" y="596" width="96" height="58" rx="10"/>
  <text class="chiptext" x="704" y="620">Redirect</text>
  <text class="chiptext" x="704" y="640" font-size="11.5">GET /:code</text>
  <text x="452" y="690" class="mono">sual-ajgc.onrender.com</text>

  <!-- ===== Database (Neon) ===== -->
  <rect class="panel" x="430" y="780" width="340" height="120" rx="16" stroke="#64748b"/>
  <!-- cylinder icon -->
  <path d="M452 812 v44 a24 8 0 0 0 48 0 v-44" fill="#1f2940" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="476" cy="812" rx="24" ry="8" fill="#1f2940" stroke="#94a3b8" stroke-width="2"/>
  <path d="M452 834 a24 8 0 0 0 48 0" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="520" y="822" class="title">PostgreSQL · Neon</text>
  <text x="520" y="846" class="sub">Singapore</text>
  <text x="520" y="874" class="mono">users · urls · clicks</text>

  <!-- ===== Visitor ===== -->
  <rect class="panel" x="900" y="120" width="260" height="110" rx="16" stroke="#4ade80"/>
  <!-- phone icon -->
  <rect x="922" y="140" width="34" height="62" rx="7" fill="#1f2940" stroke="#4ade80" stroke-width="2"/>
  <g fill="#4ade80">
    <rect x="929" y="150" width="8" height="8"/><rect x="941" y="150" width="8" height="8"/>
    <rect x="929" y="162" width="8" height="8"/><rect x="945" y="166" width="4" height="4"/>
  </g>
  <rect x="932" y="190" width="14" height="3" rx="1.5" fill="#4ade80"/>
  <text x="972" y="160" class="title">ผู้เข้าชม</text>
  <text x="972" y="186" class="sub">คลิกลิงก์สั้น</text>
  <text x="972" y="208" class="sub">หรือสแกน QR Code</text>

  <!-- ===== Destination ===== -->
  <rect class="panel" x="900" y="580" width="260" height="110" rx="16" stroke="#60a5fa"/>
  <!-- globe icon -->
  <g fill="none" stroke="#60a5fa" stroke-width="2">
    <circle cx="944" cy="634" r="22"/>
    <ellipse cx="944" cy="634" rx="10" ry="22"/>
    <line x1="922" y1="634" x2="966" y2="634"/>
  </g>
  <text x="982" y="624" class="title">เว็บปลายทาง</text>
  <text x="982" y="650" class="sub">URL ต้นฉบับ</text>

  <!-- ===== Legend ===== -->
  <rect class="panel" x="40" y="570" width="260" height="330" rx="16" stroke="#334155"/>
  <text x="62" y="602" class="title">ลำดับการทำงาน</text>
  <g class="flowlabel">
    <text x="62" y="636"><tspan font-weight="700">1</tspan>  git push โค้ดขึ้น GitHub</text>
    <text x="62" y="666"><tspan font-weight="700">2</tspan>  Deploy หน้าเว็บและ API</text>
    <text x="62" y="696"><tspan font-weight="700">3</tspan>  ผู้ใช้เปิดเว็บ โหลดแอป React</text>
    <text x="62" y="726"><tspan font-weight="700">4</tspan>  เรียก REST API พร้อม JWT</text>
    <text x="62" y="756"><tspan font-weight="700">5</tspan>  อ่าน/เขียนฐานข้อมูล</text>
    <text x="62" y="786"><tspan font-weight="700">6</tspan>  ผู้เข้าชมเปิดลิงก์สั้น</text>
    <text x="62" y="816"><tspan font-weight="700">7</tspan>  บันทึกการเปิด (clicks)</text>
    <text x="62" y="846"><tspan font-weight="700">8</tspan>  Redirect 302 ไปเว็บปลายทาง</text>
  </g>
  <text x="62" y="880" class="small">เส้นประ = ทิศทางข้อมูล</text>

  <!-- ===== Flows ===== -->
  <!-- 1 Developer -> GitHub -->
  <path class="flow" d="M170 270 V346"/>
  <g class="badge"><circle cx="170" cy="308" r="13"/><text x="170" y="313">1</text></g>
  <text x="192" y="313" class="flowlabel">git push</text>

  <!-- 2 GitHub -> Vercel / Render -->
  <path class="flow" d="M300 395 H360 V370 H426"/>
  <path class="flow" d="M300 455 H360 V600 H426"/>
  <g class="badge"><circle cx="360" cy="425" r="13"/><text x="360" y="430">2</text></g>
  <text x="318" y="362" class="small">auto deploy</text>
  <text x="318" y="620" class="small">deploy</text>

  <!-- 3 User -> Frontend -->
  <path class="flow" d="M600 230 V296"/>
  <g class="badge"><circle cx="600" cy="264" r="13"/><text x="600" y="269">3</text></g>
  <text x="622" y="269" class="flowlabel">HTTPS</text>

  <!-- 4 Frontend <-> Backend -->
  <path class="flow both" d="M600 444 V506"/>
  <g class="badge"><circle cx="600" cy="475" r="13"/><text x="600" y="480">4</text></g>
  <text x="622" y="480" class="flowlabel">REST /api/* + JWT</text>

  <!-- 5 Backend <-> Database -->
  <path class="flow both" d="M600 714 V776"/>
  <g class="badge"><circle cx="600" cy="745" r="13"/><text x="600" y="750">5</text></g>
  <text x="622" y="750" class="flowlabel">SQL (pg)</text>

  <!-- 6 Visitor -> Backend redirect -->
  <path class="flow" d="M1030 230 V540 H774"/>
  <g class="badge"><circle cx="1030" cy="390" r="13"/><text x="1030" y="395">6</text></g>
  <text x="1052" y="395" class="flowlabel">GET /:code</text>

  <!-- 7 Backend -> Database: record click (drawn beside flow 5) -->
  <path class="flow" d="M720 714 V776"/>
  <g class="badge"><circle cx="720" cy="745" r="13"/><text x="720" y="750">7</text></g>

  <!-- 8 Backend -> Destination -->
  <path class="flow" d="M774 635 H896"/>
  <g class="badge"><circle cx="835" cy="635" r="13"/><text x="835" y="640">8</text></g>
  <text x="800" y="666" class="flowlabel">302 Redirect</text>
</svg>
