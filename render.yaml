# Render Blueprint: New > Blueprint > select this repository
services:
  - type: web
    name: sual # becomes https://sual.onrender.com (Render adds a suffix if the name is taken)
    runtime: node
    plan: free
    region: singapore # same region as the Neon database, closest to Thailand
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: DB_SSL
        value: "true"
      # BASE_URL defaults to RENDER_EXTERNAL_URL (https://<service>.onrender.com)
      - key: CORS_ORIGIN
        value: https://short-url-eight-amber.vercel.app
      - key: IP_SALT
        generateValue: true
      - key: STATS_TIMEZONE
        value: Asia/Bangkok
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false # primary admin, created on start
      - key: ADMIN_PASSWORD
        sync: false
