# Render Blueprint: New > Blueprint > select this repository
services:
  - type: web
    name: short-url-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: DB_SSL
        value: "true"
      - key: BASE_URL
        sync: false # https://<this service>.onrender.com
      - key: CORS_ORIGIN
        sync: false # https://<frontend>.vercel.app
      - key: IP_SALT
        generateValue: true
      - key: STATS_TIMEZONE
        value: Asia/Bangkok
